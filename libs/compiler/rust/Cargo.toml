[package]
name = "rivet-compiler"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxc_allocator = "=0.75.0"
oxc_ast_visit = "=0.75.0"
oxc_ast = "=0.75.0"
oxc_parser = { version = "=0.75.0", default-features = false }
oxc_semantic = "=0.75.0"
oxc_span = "=0.75.0"
oxc_syntax = "=0.75.0"
oxc_transformer = "=0.75.0"
oxc_codegen = "=0.75.0"
oxc-browserslist = "=2.0.12" # pinned: >=2.0.14 narrowed Version fields, breaking oxc_transformer 0.75
oxc_index = "3"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
