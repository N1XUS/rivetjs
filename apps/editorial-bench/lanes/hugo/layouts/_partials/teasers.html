<ul class="teasers">{{ range . }}<li class="teaser"><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p class="meta">{{ .Params.author }} · <time datetime="{{ .Date.UTC.Format "2006-01-02T15:04:05Z" }}">{{ .Date.UTC.Format "2006-01-02" }}</time></p><p>{{ .Description }}</p></li>{{ end }}</ul>
