# THROWAWAY SPIKE (2026-10-06): native Rust SSR ceiling for the ssr-bench page. See README.md.
[package]
name = "rust-ceiling"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
bytes = "1.10"
form_urlencoded = "1.2"
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
itoa = "1.0"
memchr = "2.7"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = "0.14"
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "net", "macros", "time"] }
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
